[package]
name = "mod-authme"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "AuthMe for Horizon: a port of AuthMeReloaded (GPL-3.0) to Horizon native mods"

[lib]
path = "src/lib.rs"

[dependencies]
# The launcher points this at the Horizon source it builds the game from. Every other
# dependency must be a crate and version in Horizon's Cargo.lock.
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "294448014fba585f8d5d09dd8886f482493b6417" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
scrypt = { version = "0.11", default-features = false }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
subtle = "2"
getrandom = "0.3"
