# The mod's rules (authme_horizon/api/src/core), built and tested without the game.
# `cargo test` here. Same dependency versions as Horizon's Cargo.lock.
[package]
name = "authme-core-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
scrypt = { version = "0.11", default-features = false }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
subtle = "2"
getrandom = "0.3"
